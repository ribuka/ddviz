<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ddviz</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/plotly-4.1.1.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="left">
      <button type="button" id="left-strip" title="列とフィルタの欄を開く">
        <span class="strip-open">▶</span>
        <span class="strip-text">列・フィルタ</span>
      </button>
      <section id="columns">
        <div class="pane-head">
          <span>列</span>
          <button type="button" class="left-close" title="列とフィルタの欄を左へ畳む">◀</button>
        </div>
        <input class="column-search" type="search" placeholder="列名で検索（空白で区切ると、すべてを含む列）">
        <div class="column-kinds">
          <button type="button" data-kind="" class="on">すべて</button>
          <button type="button" data-kind="numeric">数値</button>
          <button type="button" data-kind="categorical">カテゴリ</button>
        </div>
        <div class="column-shares">
          <label title="値がすべて null の列を除く"><input type="checkbox" class="column-hide-empty"> null だけの列を隠す</label>
          <label title="値のある行の割合がこれ以上の列だけを出す">非 null ≥ <input type="number" class="column-min-share" min="0" max="100" step="any" placeholder="0">%</label>
          <button type="button" class="column-order" title="値のある行の割合が高い順に並べる">割合順</button>
        </div>
        <div class="column-count"></div>
        <div class="column-list"></div>
      </section>
      <section id="filters">
        <header class="pane-head filter-head">
          <span>フィルタ</span>
          <span class="filter-summary"></span>
          <button type="button" class="filter-toggle" title="フィルタ欄を畳む（条件の要約は見出しに残る）">▼</button>
        </header>
        <div class="filter-body">
          <div class="filter-list"></div>
          <div class="filter-drop">列をここにドラッグすると、その列で行を絞る</div>
        </div>
      </section>
      <div class="left-resize" title="ドラッグで欄の幅を変える"></div>
    </aside>
    <main id="builder">
      <div id="top">
        <div id="elements" role="group" aria-label="グラフの要素"></div>
        <div class="zone horizontal" data-role="col"></div>
        <div class="zone horizontal" data-role="wrap" title="Wrap：列の水準ごとのパネルを横に並べて折り返す（facet_col_wrap）"></div>
      </div>
      <div class="zone vertical" data-role="y"></div>
      <div id="stage">
        <div id="scroller">
          <div id="canvas">
            <div id="plot"></div>
            <div id="hover-ring" hidden></div>
            <div id="hover-label" hidden></div>
          </div>
        </div>
        <div id="empty">X と Y に列を置くと描きます（Y が数値の列なら X は空でも描きます）</div>
        <div id="pending" hidden>集約中…</div>
        <section id="table" hidden>
          <div class="table-resize" title="ドラッグで高さを変える"></div>
          <header class="table-bar">
            <span class="table-title"></span>
            <button type="button" class="table-prev" title="前の 100 行">‹</button>
            <span class="table-pager"></span>
            <button type="button" class="table-next" title="次の 100 行">›</button>
            <span class="table-note">グラフの列が左。矩形の外をダブルクリックで解除</span>
            <button type="button" class="table-up" title="描画領域いっぱいに広げる">▲</button>
            <button type="button" class="table-down" title="表を畳む">▼</button>
          </header>
          <div class="table-scroll"><div class="table-inner"><div class="table-grid"></div></div></div>
        </section>
      </div>
      <div class="zone vertical" data-role="row"></div>
      <div class="zone horizontal" data-role="x"></div>
      <aside id="side">
        <div class="zone stacked" data-role="overlay"></div>
        <div class="zone stacked" data-role="color"></div>
        <div id="legend"></div>
      </aside>
    </main>
  </div>
  <footer id="statusbar">
    <span id="status"></span>
    <span id="hover-warning" class="notice-warning" hidden></span>
    <details>
      <summary>計測</summary>
      <pre id="info"></pre>
    </details>
  </footer>
  <div id="toasts"></div>
  <div id="drop-tip" hidden></div>
  <div id="drop-line" hidden></div>
  <dialog id="casts">
    <p class="casts-text"></p>
    <div class="casts-list">
      <table>
        <thead><tr><th>列</th><th>ファイルでの型</th><th>読む型</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <form method="dialog"><button>OK</button></form>
  </dialog>
  <div id="converting" hidden>
    <div class="box">
      <div id="converting-text"></div>
      <progress id="converting-bar"></progress>
    </div>
  </div>
</body>
</html>
