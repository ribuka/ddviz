<!doctype html>
<html lang="ja" data-screen="graph">
<head>
  <meta charset="utf-8">
  <title>ddviz</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/titlebar.css">
  <link rel="stylesheet" href="/static/preferences.css">
  <script src="/static/vendor/plotly-4.1.1.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <script src="/static/js/preferences.js"></script>
  <script src="/static/js/titlebar.js"></script>
  <div id="app">
    <aside id="left">
      <button type="button" id="left-strip" title="列とフィルタの欄を開く">
        <span class="strip-open">▶</span>
        <span class="strip-text">列・フィルタ</span>
      </button>
      <section id="columns">
        <div class="pane-head">
          <span>列</span>
          <button type="button" class="left-close" title="列とフィルタの欄を左へ畳む">◀</button>
        </div>
        <input class="column-search" type="search" placeholder="Search ...">
        <div class="column-kinds">
          <button type="button" data-kind="" class="on">All</button>
          <button type="button" data-kind="numeric">Numeric</button>
          <button type="button" data-kind="categorical">Categorical</button>
        </div>
        <div class="column-shares">
          <label title="値がすべて null の列を除く"><input type="checkbox" class="column-hide-empty"> null だけの列を隠す</label>
          <label title="値のある行の割合がこれ以上の列だけを出す">非 null ≥ <input type="number" class="column-min-share" min="0" max="100" step="any" placeholder="0">%</label>
          <button type="button" class="column-order" title="列の並べ替え（選んでいる項目をもう一度押すと元の順に戻す）">Sort by</button>
        </div>
        <div class="column-count"></div>
        <div class="column-list"></div>
      </section>
      <section id="filters">
        <div class="filter-resize" title="ドラッグで高さを変える"></div>
        <header class="pane-head filter-head">
          <span>フィルタ</span>
          <span class="filter-summary"></span>
          <button type="button" class="filter-up" title="左ペインいっぱいに広げる">▲</button>
          <button type="button" class="filter-down" title="フィルタ欄を畳む（条件の要約は見出しに残る）">▼</button>
        </header>
        <div class="filter-body">
          <div class="filter-list"></div>
          <div class="filter-drop">Drop a column to filter</div>
        </div>
      </section>
      <div class="left-resize" title="ドラッグで欄の幅を変える"></div>
    </aside>
    <main id="builder">
      <div id="top">
        <div id="elements" role="group" aria-label="グラフの要素"></div>
        <div class="zone horizontal" data-role="col"></div>
        <div class="zone horizontal" data-role="wrap" title="Wrap：列の水準ごとのパネルを横に並べて折り返す（facet_col_wrap）"></div>
      </div>
      <div class="zone vertical" data-role="y"></div>
      <div id="stage">
        <div id="scroller">
          <div id="canvas">
            <div id="plot"></div>
            <div id="hover-ring" hidden></div>
            <div id="hover-label" hidden></div>
          </div>
        </div>
        <div id="empty">X と Y に列を置くと描きます（Y が数値の列なら X は空でも描きます）</div>
        <div id="no-rows" role="status" hidden></div>
        <div id="pending" hidden>集約中…</div>
        <section id="table" hidden>
          <div class="table-resize" title="ドラッグで高さを変える"></div>
          <header class="table-bar">
            <span class="table-title"></span>
            <button type="button" class="table-prev" title="前の 100 行">‹</button>
            <span class="table-pager"></span>
            <button type="button" class="table-next" title="次の 100 行">›</button>
            <span class="table-note">グラフの列が左。矩形の外をダブルクリックで解除</span>
            <button type="button" class="table-save" aria-label="選んだ行を保存" title="選んだ行を保存（CSV / Parquet）"><svg viewBox="0 0 857.1 857.1" aria-hidden="true"><path transform="matrix(1 0 0 -1 0 850)" d="m214-7h429v214h-429v-214z m500 0h72v500q0 8-6 21t-11 20l-157 156q-5 6-19 12t-22 5v-232q0-22-15-38t-38-16h-322q-22 0-37 16t-16 38v232h-72v-714h72v232q0 22 16 38t37 16h465q22 0 38-16t15-38v-232z m-214 518v178q0 8-5 13t-13 5h-107q-7 0-13-5t-5-13v-178q0-8 5-13t13-5h107q7 0 13 5t5 13z m357-18v-518q0-22-15-38t-38-16h-750q-23 0-38 16t-16 38v750q0 22 16 38t38 16h517q23 0 50-12t42-26l156-157q16-15 27-42t11-49z"/></svg></button>
            <button type="button" class="table-up" title="描画領域いっぱいに広げる">▲</button>
            <button type="button" class="table-down" title="表を畳む">▼</button>
          </header>
          <div class="table-scroll"><div class="table-inner"><div class="table-grid"></div></div></div>
          <div class="table-wait" role="status" hidden>データを書き出している間は表を表示できません。書き出しが終わると表示します。</div>
        </section>
      </div>
      <div class="zone vertical" data-role="row"></div>
      <div class="zone horizontal" data-role="x"></div>
      <button type="button" id="axis-freeze" aria-label="軸と色の範囲を固定" aria-pressed="false" title="軸と色の範囲を固定する" disabled>
        <svg class="lock-open" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 7V5a3 3 0 0 1 5.8-1.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/></svg>
        <svg class="lock-closed" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/></svg>
      </button>
      <aside id="side">
        <div class="zone stacked" data-role="symbol"></div>
        <div class="zone stacked" data-role="color"></div>
        <div id="legend"></div>
      </aside>
    </main>
  </div>
  <footer id="statusbar">
    <span id="status"></span>
    <span id="hover-warning" class="notice-warning" hidden></span>
    <span id="log-warning" class="notice-warning" hidden></span>
    <span id="memory" title="どちらも各プロセスのワーキングセット（今、物理メモリに載っている量）の合計で、プロセス間で共有するページを重ねて数えた概算です。&#10;バックエンド：ddviz 本体（データの読込と集約を指示するサーバー）と、データを処理するワーカーのプロセス。&#10;フロントエンド：画面を表示する WebView2 のプロセス。">
      <span>メモリ</span>
      <span>バックエンド <span id="memory-backend" class="memory-value">—</span></span>
      <span>フロントエンド <span id="memory-frontend" class="memory-value">—</span></span>
    </span>
    <details>
      <summary>計測</summary>
      <pre id="info"></pre>
    </details>
  </footer>
  <div id="toasts"></div>
  <div id="drop-tip" hidden></div>
  <div id="drop-line" hidden></div>
  <dialog id="casts">
    <p class="casts-text"></p>
    <div class="casts-list">
      <table>
        <thead><tr><th>列</th><th>ファイルでの型</th><th>読む型</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <form method="dialog"><button>OK</button></form>
  </dialog>
  <dialog id="join"></dialog>
  <div id="converting" hidden>
    <div class="box">
      <div id="converting-text"></div>
      <progress id="converting-bar"></progress>
    </div>
  </div>
</body>
</html>
