name: Release

# When VERSION changes on main, tags the commit v<VERSION>, builds the exe from
# the tag (exe.yml, with its smoke test), then creates the release as a draft,
# attaches ddviz-<VERSION>-win-x64.zip and only then publishes it. If any step
# fails, the release stays unpublished; run the workflow manually to retry: it
# reuses the tag and a draft left by the failed run. A push for a published
# release does nothing; a manual run rebuilds it from the tag and replaces the
# zip. The release steps are in packaging/release.py.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.state.outputs.build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid VERSION: '$VERSION'"
              exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # An existing tag is kept as it is, so a retry builds the same commit.
      - name: Create tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "$TAG exists: $(git rev-parse "$TAG^{commit}")"
          else
              git tag "$TAG"
              git push origin "$TAG"
          fi

      - name: Check release
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project packaging/release.py state \
            --tag "${{ steps.version.outputs.tag }}" \
            --event "${{ github.event_name }}" \
            | tee -a "$GITHUB_OUTPUT"

  exe:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    uses: ./.github/workflows/exe.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  # Runs only when the build and its smoke test passed (no `if:` here).
  publish:
    needs: [tag, exe]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.exe.outputs.zip }}

      - name: Attach the exe and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project packaging/release.py publish \
            --tag "${{ needs.tag.outputs.tag }}" \
            --zip "${{ needs.exe.outputs.zip }}"
