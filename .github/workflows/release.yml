name: Release

# When VERSION changes on main, tags v<VERSION>, creates the release and
# attaches the exe (ddviz-<VERSION>-win-x64.zip). If the tag already exists, a
# push does nothing; a manual run builds the exe from the tag again and
# replaces the zip on its release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.tag.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid VERSION: '$VERSION'"
              exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
          else
              echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh release create \
            "$TAG" \
            --title "$TAG" \
            --generate-notes

  exe:
    needs: release
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/exe.yml
    with:
      ref: ${{ needs.release.outputs.tag }}

  attach:
    needs: [release, exe]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.exe.outputs.zip }}

      - name: Attach the exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ needs.release.outputs.tag }}" \
            "${{ needs.exe.outputs.zip }}" \
            --clobber \
            --repo "${{ github.repository }}"
