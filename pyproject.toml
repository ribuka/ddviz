[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddviz"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "polars>=1.44.2",
    "pywebview>=6.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ddviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
