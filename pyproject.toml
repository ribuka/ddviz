[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddviz"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "polars>=1.44.2",
    "pyarrow>=26.0.0",
    "pywebview>=6.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "httpx2==2.16.0",
    "playwright==1.63.0",
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.7",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/ddviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]
# E2E and JS tests run only with `-m e2e` or `-m js` (a later -m replaces this one).
addopts = ["-m", "not e2e and not js", "--browser-channel", "chrome"]
markers = [
    "e2e: drives the UI in a browser (playwright); run with -m e2e",
    "js: calls the static JS modules in a browser page without the app; run with -m js",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
