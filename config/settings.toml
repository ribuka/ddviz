# ddviz の設定。exe では ddviz.exe と同じフォルダの config/settings.toml を読む。
# 項目を省いたときは既定値を使う。

[cache]
# 列キャッシュ（%LOCALAPPDATA%\ddviz\cache）の合計の上限（GB）。
# 超えたら、最後に使った日時が古い列から消す。
max_gb = 10
# この日数のあいだ使わなかった列のキャッシュを消す。
max_unused_days = 30

[plot]
# Color・Group X・Group Y に置くカテゴリの列の水準の上限。
# 超える列は、集約の前に断る。X / Y のカテゴリの軸も同じ上限を使う。
max_levels = 100

[plot.legend]
# 凡例のクリックで非アクティブにした系列の不透明度（0〜1）。
# 0 なら非アクティブの系列は見えなくなり、ホバーでも拾わない。
# 範囲選択の間、選ばれなかった行は 0.25 で描くので、0.25 以上にすると
# 選ばれなかった系列と非アクティブの系列の見分けがつきにくくなる。
inactive_opacity = 0.1

[columns]
# 左の列リストに出す列の上限。検索に一致した列のうち、上から何列を出すか。
# 1000 なら 200 と同じくらいの速さで出る。数千を超えると、検索の入力の
# たびに画面が重くなる（5000 で 1 回約 0.2 秒、2 万で約 0.5 秒）。
max_listed = 1000
# 列名の検索の履歴に残すキーワードの数（入力のファイルごと）。列リストの列を
# ゾーンやフィルタに置いたときの検索ボックスのキーワードを、新しい順に残す。
max_history = 20

[hover]
# 開いている結果（全体図と表示範囲）のホバー用のファイルの合計の上限（GB）。
# 一時フォルダに置く。超えそうなときは、軸でない列をホバーから外し、
# 軸の列だけでも超えるときは、その結果ではホバーを出さない。
max_temp_gb = 2
